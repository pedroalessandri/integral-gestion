name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El typecheck y los tests del api dependen del cliente de Prisma y del dist de los paquetes.
      - run: pnpm --filter api prisma:generate
      - run: pnpm turbo run build --filter="./packages/*"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # tsc y lint no detectan errores propios de next build (p. ej. server actions no async).
      - run: pnpm --filter web build
